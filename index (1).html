<script>
const D=[["ሥርዓተ ቅዳሴ"], ["ይህች ቀን ምን ያህል የምታስፈራ ናት ፤", "ይህችስ ሰዓት ምን ያህል የምታስጨንቅ ናት ፤", "መንፈስ ቅዱስ ከሰማየ ሰማያት የሚወርድባት፤", "כמה נורא היום הזה וכמה נפלאה השעה", "הזו שבה רוח הקודש תרד מן השמים"], ["ይህን መሥዋዕቱን የሚሰውርባትና የሚያከብርባት።  በጽሞናና በመፍራት ቁሙ ፤ የእግዚአብሔር ሰላም ከእኔና ከእናንተ ጋራ ይሆን ዘንድ ጸልዩ ።", "ולהאפיל ולקדש את הקורבן הזה. בשקט ובפחד, קומו והתפללו ששלום האל יהיה עמי ועם כולכם.", {"r": "people", "a": "ሕዝብ", "h": "אנשים", "x": ""}, "አሜን", "אמן"], [{"r": "people", "a": "ሕዝብ", "h": "אנשים", "x": ""}, "​እምነ በሐ፥ ቅድስት ቤተክርስቲያን፥ ሥርጉት አረፋቲሃ በዕንቍ ጳዝዮን፤ እምነ በሐ፥ ቅድስት ቤተክርስቲያን፡፡", "ሰላም ላንቺ ይሁን፤ እናታችን ክብርት ቤተ ክርስቲያን፡፡ ግድግዳዎችሽ በጳዝዮን እንቍ የተጌጡ ናቸው፤ ሰላም ላንቺ ይሁን! እናታችን ክብርት ቤተ ክርስቲያን፡፡", "שלום לך אמנו, הכנסייה הנכבדה. חומותייך רקומות בטופז. שלום לך אמנו, הכנסייה הנכבדה."], [{"r": "people", "a": "ሕዝብ", "h": "אנשים", "x": ""}, "​ሃሌ ሉያ! እመቦ ብእሲ እምእመናን ዘቦአ ቤተ ክርስቲያን በጊዜ ቅዳሴ ወኢሰምአ መጻሕፍተ ቅዱሳተ ወኢተዐገሰ እስከ ይፌጽሙ ጸሎተ ቅዳሴ", "ሃሌ ሉያ በቅዳሴ ጊዜ ከምእመናን ወገን ወደ ቤተ ክርስቲያን የገባ ሰው ቢኖር ቅዱሳት መጻሕፍትን ሰምቶ የቅዳሴውን ጸሎት እስኪጨርሱ ባይታገስ ከቁርባን ባይቀበል ከቤተ ክርስቲያን ይውጣ", "הללויה! אם יש מישהו מהמאמינים שנכנס לכנסייה בזמן המיסה ולא שמע את כתבי הקודש, ולא המתין עד שסיים את תפילת המיסה, ולא קיבל את סעודת הקודש, יגורש מן הכנסייה."], ["​ወኢተመጠወ እምቍርባን ይሰደድ እምቤተ ክርስተያን እሰመ አማሰነ ሕገ እግዚአብሔር ወአስተሐቀረ ቁመተ ቅድመ ንጉሥ ሰማያዊ ንጉሠ ሥጋ ወመንፈስ ከመዝ መሐሩነ ሐዋርያት በአብጥሊሶሙ።", "የእግዚአብሔርን ሕግ አፍርሷልና የነፍስና የሥጋ ንጉስ በሚሆን በሰማያዊ ንጉሥ በክርስቶስ ፊት መቆምን አቃሏልና ሐዋርያት በሲኖዶሳቸው እንዲህ ሲሉ አሰተማሩን", "כי הפר את חוק האל וזלזל בעמוד לפני המלך השמימי, מלך הגוף והרוח. זאת לימדו אותנו השליחים בקאנונים שלהם."], [{"r": "people", "a": "ሕዝብ", "h": "אנשים", "x": ""}, "​አንቲ ውእቱ መሶበ ወርቅ ንጹሕ እንተ ውስቴታ መና ኅቡእ ኅብስት ዘወረደ እምሰማያት ወሃቤ ሕይወት ለኲሉ ዓለም", "ንጹሕ የወርቅ መሶብ አንቺ ነሽ፤ በውስጧ የተሰወረ መና የነበረባት፤ ከሰማያት የወረደ ኅብስት ለዓለም ሁሉ ድኅነት የሚሰጥ", "אתה סיר הזהב הטהור שבו טמון המן, הלחם אשר ירד ממנו גן עדן נותן חיים לכל העולם."], [{"r": "priest", "a": "ካህን", "h": "כומר", "x": ""}, "​ንጹሕ ወጣዕም ወበረከት ለእለ ይሰትዩ እምደምከ ክቡር አላትዬን በአማን አሜን።", "በእውነት ሰው የሆንህ አምላክ ሆይ ንጹሕ ጣዕም በረከትም ከክቡር ደምህ ለሚጠጡ ይሁን፤ አሜን", "טוהר, מתיקות וברכה למי ששותה בכנות מדמך הי "አሁንም በክብርት ቤተ ክርስቲያንህ ሁልጊዜ የክህነትን ሥራ ለሚሰሩ ለንጹሓን አገልጋዮችህ አቤቱ አንተ ክህነትን ሰጠህ ፤ በምድር ላይ ኃጢአትን ይቅር ይሉ ዘንድ። ያስሩ ዘንድ የበደልንም ማሰሪያ ሁሉ ይፈቱ ዘንድ።", "לכן, יהוה, הענקת עתה את הכהונה למשרתיך הטהורים אשר תמיד ממלאים את תפקיד הכוהנים בכנסייתך הקדושה, למען יסלחו חטאים עלי אדמות, יקשרו וישחררו את כל כבלי העוול."], ["አሁንም አቤቱ ሰዉ ወዳጅ ሆይ ፤ ዳግመኛ ከቸርነትህ እን ለምናለን እንሻለንም። ስለነዚህ ስለ ወዳጆችም ስለ ሴቶችም ባሮችህ ፤ አባቶቼና ወንድሞቼ እኅቶቼም ደካማ ስለምሆን ስለ እኔም ስለ ባርያህ ፤ በቅዱስ መሠዊያህም ፊት ራሳቸዉን ዝቅ ስለ አደረጉ ሰዎች የምሕረትህን ጎዳና ጥረግልን የኃጢአታችንን ማሰሪያም ሁሉ ፈጽመህ አጥፋልን", "שוב אנו מתפללים ומתחננים לטובך, הו אוהב אדם, בעד עבדיך ושפחותיך אלה, אבותיי ואחיי ואחיותיי, וגם בשמי, בעד עבדך החלש, ובעד אלה המרכינים ראשם לפני מזבחך ​​הקדוש. הכינו לנו את דרך רחמיכם, שבר ונתק את כל כבלי חטאינו."], ["አቤቱ አንተን ብንበድል በማወቅ ወይም ባለማወቅ በተን ኮልም ቢሆን በልቡና ክፋትም ቢሆን በመሥራትም ቢሆን በመናገርም ቢሆን የሰዉን ድካሙን አንተ ታዉቃለህና። ቸር ሰዉ ወዳጅ ሆይ የፍጥረቱ ሁሉ ጌታ አቤቱ የኃጢአታችንን ሥርየት ስጠን ፤ ባርከን ፤ አክብረንም ነጻም አድርገን ፤ አን ጻን የተፈታን ነጻም የወጣን አድርገን ሕዝቡንም ሁሉ ፍታቸዉ", "בין אם פגענו בך, ה', ביודעין או שלא ביודעין, בין במרמה או בנבילת הלב, בין במעשה או בדיבור או בהבנה מוגבלת, כי אתה יודע את חולשת האדם. הו אוהב האדם הטוב ואדון כל הבריאה, הענק לנו, ה', סליחה על חטאינו, ברך אותנו וטהר אותנו, שחרר אותנו וכפר על כל עמך."], ["ስምህን መፍራትንም የተመላን አድርገን። ቅዱስ ፈቃድህንም በመፍራት አጽናን። ቸር ሆይ ጌታችንና አምላካችን መድኃኒታችን አንተ ኢየሱስ ክርስቶስ ነህና። ምስጋናንና ክብርን ለአንተ እናቀርባለን። ሰማያዊ ከሚሆን ከቸር አባትህ ጋራ ፤ ማሕየዊ ከሚሆን ከመንፈስ ቅዱስም ጋራ ትክክል የሚሆን ዛሬም ዘወትርም ለዘላለሙ አሜን።", "ומלא אותנו ביראת שמך, וחזק אותנו בעשיית רצונך. הו הטוב, כי אתה אדוננו, אלוהים ומושיענו ישוע המשיח, לך אנו שולחים תהילה וכבוד, עם האב שבשמיים הטוב, ורוח הקודש המחייה, השווה לך, גם עכשיו וגם לעולם ועד ולעולם. אמן"], ["በዚህች ቀን ያገለገሉህ ባሮችህ ቄሱና ዲያቆኑ ካህናቱም ሕዝቡም ሁሉ እኔም ድኃዉ ባርያህ የተፈቱና ነጻ የወጡ የነጹ ይሁኑ። ልዩ ሦስት በሚሆን በአብ በወልድ በምንፈስ ቅዱስ አፍ ሐዋርያት በሰበሰቧት በቅድስት ቤተ ክርስቲያን አፍ ፤ በዓሥራ አምስቱ ነቢያት አፍ በዓሥራ ሁለቱ ሐዋርያት አፍ ፤", "יהיו נא עבדיך המשרתים ביום הזה, הכהן והשמש, כלי הקודש וכל העם, ואנוכי עצמי עבדך הדל, מחולים, משוחררים ומטוהרים מפי השילוש הקדוש, האב והבן ורוח הקודש, ומפי העדה הקדושה והשליחית האחת, ומפי חמישה-עשר הנביאים, ומפי שנים-עשר השליחים,"], ["ሥልጣን አገልጋዮች በሆኑ በሰባ ሁለቱ አርድዕት አፍ መለኮትን በተናገረ ወንጌላዊ ሐዋርያና አማእትም በሆነ በማርቆስ አፍ። ንጹሕ ክቡር አባት በሚሆን በጳጳሳቱ አለቃ በሳዊሮስና በቅዱስ ዲዮስቆሮስ በቅዱስ አትናቴዎስም በቅዱስ ዮሐንስ አፈወርቅና በቅዱስ ቄርሎስ በቅዱስ ጎርጎርዮስና በቅዱስ ባስልዮስ ቃል።", "ומפי שבעים ושניים התלמידים המשרתים, ומפי דובר האלוהות, מרקוס המבשר, השליח והקדוש המעונה: ומפי הפטריארכים המכובדים, סוורוס הקדוש, דיאוסקורוס הקדוש, אתנסיוס הקדוש, יוחנן כריסוסטומוס הקדוש, קירילוס הקדוש, גרגוריוס הקדוש ובסיליוס הקדוש:"], ["አርዮስን ለማውገዝ በኒቂያ በተሰበሰቡ ሃይማኖታቸው በቀና በሦስት መቶ ዐሥራ ስምንት ሊቃውንትም ቃል፡፡ መቅዶንዮስን ለማውገዝ በቍስጥንጥንያ በተሰበሰቡ በመቶ አምሳው ሊቃውንትም ቃል፡፡", "ומפי שלוש מאות ושמונה-עשר האורתודוקסים אשר התכנסו בניקאה כדי להרשיע את אריוס, ומפי מאה וחמישים אשר התכנסו בקונסטנטינופול כדי להרשיע את מקדוניוס,"], ["ንስጥሮስን ለማውገዝ በኤፌሶን በተሰበሰቡ በሁለት መቶ ሊቃውንትም ቃል በክቡር የሊቃነ ጳጳሳት አለቃ በአባ ንዑድ ክቡር በሚሆን በሊቀ ጳጳሳችን አባ ቃል ድኃ ምስኪን በምሆን በኔም በኃጥኡ ቃል የተፈቱ ነጻም የወጡ ይሁኑ፡፡", "ומפי המאתיים אשר התכנסו באפסוס כדי להרשיע את נסטור, ומפי האב הפטריארך המכובד אבא והארכיבישוף המבורך אבא ......., ומפי שלי גם כן, החוטא, האומלל והדל, יהיו מחולים ומשוחררים,"], ["አምላክን በወለደች በሁለት ወገን ድንግል በሆነች ባዲሲቱ መሣሪያ በክብርት እመቤታችን በማርያም ቃል። የቅዱስ ስምህ ምስጋና ቡሩክ ፍጹም ነዉና ፤ ልዩ ሦስት የምትሆን አብ ወልድ መንፈስ ቅዱስ ሆይ ፤ ዛሬም ዘወትርም ለዘላለሙ ፤ አሜን።", "ומפי גבירתנו מריה הקדושה, בעלת הבתולים הכפולים, אם האלוהים, הנול החדש; כי שמך הקדוש מבורך ומלא כבוד, הו השילוש הקדוש, האב והבן ורוח הקודש, עתה ולעולם ולעולמי עולמים. אמן."], ["​ዲያቆኑ ሲጸልይ ሕዝቡ በመከተል በየምዕራፉ", "«አሜን ኪርያላይሶን አቤቱ ይቅር በለን» ይበል", "כאשר הדיאקון מתפלל, על העם ללכת אחריו ולומר", "\"אמן, קרייליאסון, אלוהים, סלח לנו\" בכל פרק.", {"r": "deacon", "a": "ዲያቆን", "h": "דיאקון", "x": ""}, "አንድ ስለምታደርግ ሥጋውና ደሙ እግዚአብሔር በይቅርታው አንድ ያደርገን ዘንድ ሰላምን እንማልዳለን።", "למען השלום, דברים קדושים אנו מתחננים, שאלוהים יעניק לנו שלום ברחמיו."], ["እግዚአብሔር የሱን ሃይማኖት በንጹሕ እንድንጠብቅ ይሰጠን ዘንድ ስለ ሃይማኖታችን እንማልዳለን", "למען אמונתנו אנו מתחננים, שאלוהים ייתן לנו לשמור על האמונה בטהרה.", "እስከ ፍጻሜያችን ድረስ እግዚአብሔር በመንፈስ ቅዱስ አንድነት ይጠብቀን ዘንድ ስለ አንድነታችን እንማልዳለን", "עבור קהילתנו אנו מתחננים, שאלוהים שישמור אותנו עד הסוף בקהילת רוח הקודש."], ["በመከራችን ሁሉ እግዚአብሔር የትዕግሥትን ፍጻሜ ይሰጠን ዘንድ ስለ ነፍሳችን ትዕግሥት እንማልዳለን", "על סבלנות הנפש אנו מתחננים, שאלוהים יעניק לנו סבלנות שלמה בכל צרותינו", "ቅዱሳን ስለሚሆኑ ነቢያት ከሳቸው ጋራ እግዚአብሔር ይቈጥረን ዘንድ እንማልዳለን", "בְּשֶׁל הַנְּבִיאִים הַקָּדוֹשִׁים אֲנַחְנוּ, שֶׁיִּסְפַּרְנוּ אוֹתָם הָאֱלֹהִים."], ["እነሱ ደስ እንዳሰኙት ደስ ልናሰኘው እግዚአብሔር (ማገልገሉን) ይሰጠን ዘንድ ዕድል ፈንታቸውንም ያድለን ዘንድ አገልጋዮች ስለሚሆኑ ሐዋርያት እንማልዳለን", "בעד השליחים המשרתים אנו מתחננים, שיתן לנו אלוהים להיות רצויים כשם שהם היו רצויים, חלק לנו אתם הרבה.", "እግዚአብሔር ለኛ የሰማዕትነትን ሥራ ይሰጠን ዘንድ ቅዱሳን ስለሚሆኑ ሰማዕታት እንማልዳለን", "עבור המרטירים הקדושים אנו מתחננים, שאלוהים ייתן לנו לשכלל את אותה שיחה."], ["የቤተ ክርስቲያን አገልጋዮች እነሱ ናቸውና እግዚአብሔር እነሱን ለረጅም ወራት ይሰጠን ዘንድ ያለ ነውር በንጽሕና ሆነው በዕውቀት የሃይማኖትን ቃል ያቀኑ ዘንድ ስለ ርእሰ ሊቃነ ጳጳሳቱ______  ብጹዕ ስለሚሆን ስለ ሊቀ ጳጳሳችንም አባ__________ እንማልዳለን", "עבור הפטריארך שלנו... והארכיבישוף המבורך... אנו מתחננים, שיעניקו להם אורך ימים להיות עלינו, כדי שיוכלו לדבר בצדק את דבר האמונה בטוהר וללא רבב, כי הם מגיני הכנסייה."], ["የክህነትን ሥልጣን ከእነሱ እግዚአብሔር እንዳያርቅ መትጋትን እሱን መፍራትንም እስከ ፍጻሜ ይሰጥልን ዘንድ ድካማቸውንም ይቀበል ዘንድ ስለ ቀሳውስት እንማልዳለን", "בעד הכוהנים אנו מתחננים, שאלוהים לעולם לא ייקח מהם את רוח הכהונה, ויתן להם את חסד הקנאות והיראה מפניו עד הסוף ויקבל את עמלם."], ["ፈጽመው ሊፋጠኑ መፋጠንን እግዚአብሔር ይሰጣቸው ዘንድ በቅድስናም ይቀርቡ ዘንድ ድካማቸውንና ፍቅራቸውንም ያስብ ዘንድ ስለ ዲያቆናት እንማልዳለን", "עבור הדיאקונים אנו מתחננים, שאלוהים ייתן להם לרוץ בדרך מושלמת, וימשוך אותם גבוה אליו בקדושה, ויזכרו את עמלם ואהבתם."], ["የሃይማኖታቸውን ትጋት ሊፈጽሙ እግዚአብሔር ይሰጣቸው ዘንድ ስለ ንፍቀ ዲያቆናት ስለ አንባቢዎችም ስለ መዘምራንም እንማልዳለን", "עבור עוזרי הדיקונים, האנאגנוסטים והזמרים אנו מתחננים, שאלוהים ייתן להם לשכלל את חריצות אמונתם."], ["ልመናቸውን ይሰማቸው ዘንድ ይልቁንም የመንፈስ ቅዱስን ሀብት በልቡናቸው ያሳድርባቸው ዘንድ ድካማቸውንም ይቀበል ዘንድ ስለ ባልቴቶች ረዳትም ስለሌላቸው እንማልዳለን", "בעד האלמנות והאבלים אנו מתחננים, שאלוהים ישמע את תפילותיהם, יעניק להם בשפע בליבם את חסד רוח הקודש ויקבל את עמלם."], ["እግዚአብሔር የድንግልናቸውን ዋጋ (አክሊል) ይሰጣቸው ዘንድ ለእግዚአብሔርም ወንዶችም ሴቶች ልጆች ይሆኑት ዘንድ ድካማቸውንም ይቀበል ዘንድ ስለ ደናግል እንማልዳለን", "בעד הבתולות אנו מתחננים, שיעניק להן אלוהים כתר בתוליהן, ושהיו לאלוהים בנים ובנות ושהוא יקבל את עמלן."], ["በመታገሳቸው ዋጋቸውን ይቀበሉ ዘንድ እግዚአብሔር እንዲሰጣቸው ስለሚታገሱ ሰዎች እንማልዳለን", "עבור אלה הסובלים בסבלנות אנו מתחננים, שאלוהים יעניק להם לקבל את גמולם באמצעות סבלנות.", "በንጽሕና ሆነው ይጠብቁ ዘንድ እግዚአብሔር ሃይማኖትን እንዲሰጣቸው ስለ ሕዝባውያንና ስለ መሃይምናን እንማልዳለን", "עבור הדיוטות והמאמינים אנו מתחננים, שאלוהים יעניק להם אמונה שלמה אשר יוכלו לשמור בטוהר."], ["በጎውን ዕድል ኃጢአትን ለማስተስረይ ሁለተኛ መወለድ የሚገኝበትን ሕጽበት እግዚአብሔር ይሰጣቸው ዘንድ በቅድስት ሥላሴም ማኅተም ያከብራቸው ያትማቸው ዘንድ ስለ ንዑሰ ክርስቲያን እንማልዳለን", "עבור הקטכומנים אנו מתחננים, שאלוהים יעניק להם חלק נכבד ורחיצת ההתחדשות למחילת חטאים, ויחתום אותם בחותם השילוש הקדוש."], ["በዘመኑ ፍጹም ሰላምን እግዚአብሔር ይሰጣት ዘንድ እግዚአብሔርን ስለምትወድ ስለ አገራችን ኢትዮጵያ እንማልዳለን", "למען ארצנו אתיופיה אנו מתחננים, שאלוהים ייתן לה שלום לנצח.", "ዕውቀትን እሱን መፍራትንም እግዚአብሔር ይሰጣቸው ዘንድ ስለ መኳንንትና ሥልጣን ስላላቸው እንማልዳለን", "בעד השליטים ובעלי הסמכות אנו מתחננים, שאלוהים יעניק להם מחוכמתו ויראתו."], ["ስለዓለሙ ሁሉ እግዚአብሔር ማሰብን ያስቀድም ዘንድ ለእያንዳንዱም የሚያስፈልገውን ያማረውን የሚሻውንም ያስብ ዘንድ ስለ ዓለም ሁሉ እንማልዳለን", "בעד העולם כולו אנו מתחננים, שאלוהים יזרז את מטרתו ויתן במוחם של כולם וכל אחד לרצות את הטוב והמועיל."], ["እግዚአብሔር ይቅርታ ባለው ቀኝ መርቶ በፍቅርና በደኅንነት ወደ ማደሪያቸው ይመልሳቸው ዘንድ በባሕርና በደረቅ ስለሚሄዱ ሰዎች እንማልዳለን", "עבור ההולכים בים וביבשה אנו מתחננים, שאלוהים ידריך אותם ביד ימין רחומה ויאפשר להם להיכנס לביתם בשלום ובבטחה."], ["እግዚአብሔር የዕለት የዕለት ምግባቸውን ይሰጣቸው ዘንድ ስለተራቡና ስለተጠሙ ሰዎች እንማልዳለን", "עבור הרעבים והצמאים אנו מתחננים, שאלוהים יעניק להם את מזונם היומי.", "እግዚአብሔር ፈጽሞ ያረጋጋቸው ዘንድ ስለ አዘኑና ስለተከዙ ሰዎች እንማልዳለን", "עבור העצובים והכואבים אנו מתחננים, שאלוהים ייתן להם נחמה שלמה."], ["እግዚአብሔር ከእሥራታቸው ይፈታቸው ዘንድ ስለ ታሠሩ ሰዎች እንማልዳለን", "עבור האסירים אנו מתחננים, שאלוהים יוכל לשחרר אותם מכבליהם.", "እግዚአብሔር በሰላም ወደ አገራቸው ይመልሳቸው ዘንድ ስለተማረኩ ሰዎች እንማልዳለን", "עבור השבויים אנו מתחננים, שהאל יחזירם לארצם בשלום."], ["እግዚአብሔር ትዕግሥትን በጎ ትምህርትንም ይሰጣቸው ዘንድ የድካማቸውንም ፍጹም ዋጋ ይሰጣቸው ዘንድ ስለተሰደዱ ሰዎች እንማልዳለን", "עבור אלו שנשלחו אנו מתחננים שאלוהים ייתן להם סבלנות והדרכה טובה, ויתן להם שכר מלא על עמלם.", "እግዚአብሔር ፈጥኖ ያድናቸው ዘንድ ይቅርታውንና ቸርነቱንም ይልክላቸው ዘንድ ስለታመሙትና וש הקדוש, אב, בן ורוח הקודש, ברכו את עמך, נוצרים אהובים, בברכות שמימיות וארציות."], ["በእኛም ላይም የመንፈስ ቅዱስ ጸጋን ላክ ፤ የቅድስት ቤተ ክርስቲያንህንም ደጆች በምህረትና በሃይማኖት እንዲከፈቱ አድርግልን ፤ እስከ መጨረሻይቱ ሐቅታም ድረስ ልዩ ሦስትነትህን ማመንን ፈጽምልን።", "ושלח עלינו את חסד רוח הקודש, ושמור את דלתות כנסייתך הקדושה פתוחות בפנינו ברחמים ובאמונה;שלמה לנו את אמונת שילושך הקדוש עד נשימתנו האחרונה."], ["ጌታዬ ኢየሱስ ክርስቶስ ሆይ የታመሙ ወገኖችህን ጎብኝ ፤ የሄዱትንና እንግዶች የሆኑትን አባቶቻችንን ወንድሞቻችንን መርተህ በሰላምና በጤና ወደ ቤታቸው መልሳቸው።", "אדוני ישוע המשיח, בקר את חולי עמך; רפא אותם; והנחה את אבותינו ואת אחינו אשר נסעו והפכו לזרים; השיבם למשכניהם בשלום ובבריאות."], ["የሰማዩን ነፋስ ባርክ ዝናሙንም በዚህች ዓመት የሚያፈራውን የምድሩን ፍሬ እንደ ቸርነትህ ባርክ ፤ ዘወትር ተድላንና ደስታ አድርግ ፤ ሰላምህንም አጽናልን ፤ ሁልጊዜ ለኛ በጎ ነገርን ሊያደርጉልን ጽኑዓን የሚሆኑ የኃያላኑን ልቡና መልስ።", "ברך את אויר השמים, את גשמי הארץ ופירות הארץ של השנה הזאת, בהתאם לחסדך, והפוך שמחה ושמחה לנצח על פני הארץ."], ["በቅድስት ቤተ ክርስቲያንህ ሁልጊዜ ለሚሰበሰቡ ለቤተ ክርስቲያን ሊቃውንት ፍቅርን ስጥ ፤ ለሁሉም ለያንዳንዱ በየስማቸው ኃያላን በሚሆኑ ፊት ሰላምን አብዛላቸው ፤ አምላካችን ሆይ በቀናች ሃይማኖት ሆነው ያንቀላፉትንና ያረፉትን ያባቶቻችንንና የወንድሞቻችንን የእኅቶቻችንንም ነፍስ አሳርፍ።", "וְהַקְשֵׁר לָנוּ אֶת שְׁלוֹמְךָ. הַשְׁבוּ אֶת לִבָּם מַלְכִים שֶׁיַּעֲשׂוּ עָלֵינוּ תָּמִיד לַחֲסוֹדִים. הַשְׁבוּ שָׁלוֹם לְחַכְמֵי הַכְּנְסִית הַנַּסְתִּים הַנִּתְאֲסוּפִים בְּכֻנְסִיתְךָ הַקָּדוֹשׁ; הַנ"], ["አምላካችን ክርስቶስ በኢየሩሳሌም ሰማያዊት ዋጋቸውን ይከፍላቸው ዘንድ እጣንና ቍርባን ወይንና ሜሮን ዘይትም መጋረጃም የንባብ መጻሕፍቶችን የቤተ መቅደስንም ንዋያት በመስጠት የሚያገለግሉትንም ባርክ።", "וברכו את נותני מתנות הקטורת, הלחם והיין, המשחה והשמן, התליונים וספרי הקריאה וכלי המקדש, למען ייתן להם המשיח אלוהינו את שכרם בירושלים השמימית."], ["ይቅርታን ያገኙ ዘንድ ከእኛ ጋራ የተሰበሰቡትንም ሁሉ አምላካችን ክርስቶስ ሆይ ይቅር በላቸው ፤በሚያስፈራና በሚያስደነግጥ በመንበርህ ፊት ምፅዋት ያመጡትንም ሁሉ ተቀበላቸው፡፡ የተጨነቀችይቱንም ነፍስ ሁሉ አሳርፍ። በሰንሰለት የታሰሩትን በስደትና በምርኮ ያሉትንም፡", "וכל המתאספים איתנו להתחנן לרחמים, ירחם עליהם משיח אלוהינו; וכל הנותנים צדקה לפני כסאך הנורא והנורא, קבלו. ונחם כל נפש צרה, את השבויים ואת אלה שבגלות או בשבי."], ["መሪር በሆነ አገዛዝ የተያዙትንም አምላካችን ሆይ በቸርነትህ አድናቸዉ ፤ መምህራችን ኢየሱስ ክርስቶስ ሆይ ወደአንተ በምንማልድት ጊዜ እን ድናስባቸዉ ያዘዙንም ሁሉ በሰማያዊት መንግሥትህ አስባቸዉ፡", "ואת המוחזקים בעב רכה ותקווה טובה ממך, למען תשמור ותברך אותם ותצמיח את ילדיהם; ובכל עת שהם מקבלים את השיתוף הקדוש, הענק נא להם אותו לברכה,"], ["በጌታችን  በኢየሱስ  ክርስቶስ በርሱ ያለ  ክብር  ጽንዕ  ለአንተ  ይገባል ከርሱ  ጋራ  ከመንፈስ  ቅዱስም  ጋራ  ዛሬም  ዘወትርም  ለዘለዓለሙ  አሜን ።", "באמצעות ישוע המשיח אדוננו, אשר דרכו לך עמו ועם רוח הקודש התפארת והממשלה, הן עתה והן תמיד ולעולמי עולמים. אמן."], [{"r": "deacon", "a": "ዲያቆን", "h": "דיאקון", "x": ""}, "​ስግዱ ለእግዚአብሔር በፍርሃት", "በፍርሃት ሆናችሁ ለእግዚአብሔር ስገዱ", "עבדו את ה' ביראה.", {"r": "people", "a": "ሕዝብ", "h": "אנשים", "x": ""}, "​ቅድሜከ እግዚኦ ንሰግድ ወንሴብሐከ", "አቤቱ በፊትህ እንሰግዳለን", "לפניך, אדוני, אנו משתחווים, ואותך אנו מהללים."], [{"r": "priest", "a": "ካህን", "h": "כומר", "x": ""}, "​የንስሐ ጸሎት / תפילת תשובה", "አቤቱ ዓለሙን ሁሉ የያዝህ ጌታችን እግዚአብሔር አብ የነፍሳችንንና የሥጋችንን የደመ ነፍሳችንንም ቁስል የምታድን አንት ነህ። ባንድ ልጅህ በጌታችን በአምላካችን በመድኃኒታችን በኢየሱስ አፍ ተናግረሃልና", "אדוני אלוהים, אב כל יכול, אתה הוא המרפא את פצעי נפשנו, גופנו ורוחנו, כי אמרת, בפי בנך יחידנו, אדוננו, אלוהינו ומושיענו ישוע המשיח,"], ["ለአባታችን ለጴጥሮስ እንዲህ ብሎ የተናገረውን አንተ ድንጋይ ነህ በዚህችም ድንጋይ ላይ ክብርት ቤተ ክርስቲያኔን እሠራታለሁ የሲኦልም ደጆች ሊያጠፏትና ሊያነዋውጧት አይችሉም።", "אשר אמר לאבינו פטרוס, אתה צוק, ועל הצוק הזה אבנה את כנסייתי הקדושה, ושערי הגיהינום לא יגברו עליה;"], ["ላንተም የመንግሥተ ሰማያትን መክፈቻ እሰጥሃለሁ በምድር ያሰርኸው በሰማይ የታሰረ ይሆን ዘንድ። በምድርም የፈታኸው በሰማይ የተፈታ ይሆን ዘንድ ወንዶቹም ሴቶቹም ባሮችህ ሁሉ በየስማቸው የተፈቱ ነጻም የወጡ ይሁኑ።", "ולך אני נותן את מפתחות מלכות השמים; מה שתאסור בארץ יהיה אסור בשמים, ומה שתתיר בארץ יהיה מותר בשמים. תן לכל דבריך להיות עבדים ושפחותיך, לפי שמותיהם השונים,"], ["በመንፈስ ቅዱስ ቃል ኃጥእ በደለኛ በምሆን በኔም በባሪያህ ቃል በማወቅ ወይም ባለማወቅ ቢሠሩ አቤቱ እሊህን ባሮችህን አባቶችንና ወንድሞችን እኅቶቼንም አጽንተህ ጠብቃቸው።", "הייה נפטור והשתחרר מפי רוח הקודש, וגם מפי, עבדך החוטא והאשם... בין אם עשו ביודעין ובין אם שלא ביודעין. שמור עליהם, אדוני, והגן עליהם, עבדיך, אבותיי, אחיי ואחיותיי"], ["ዳግመኛም ኃጥእ በደለኛ የምሆን እኔንም ወራዳነቴን አይተህ ፍታኜ ልዩ ሦስት በሚሆኑ በአብና በወልድ በመንፈስ ቅዱስም ቃል የተፈቱ ነጻም የወጡ ይሁኑ። ኃጥእ በደለኛ በምሆን በኔም በባሪያህ ቃል።", "וגם שחרר אותי, עבדך הענו והחוטא, גם מציל אותם וגם שחרר אותם: מפי השילוש הקדוש: האב, הבן ורוח הקודש, ומפי עבדך החוטא והלא צדיק."], ["መሐሪ ይቅር ባይ ሰውንም የምትወድ አምላካችን እግዚአብሔር ሆይ የዓለሙን ኃጢአት የምታርቅ የወንዶቹንና የሴቶቹን ባሮችህን ንስሓቸውን ተቀበል። የዘላለም ደኅንነት የሚሆን ብርሃንንም ግለጽላቸው አቤቱ ኃጢአታቸውንም ሁሉ ይቅር በላቸው ቸር ሰው የምትወድ አንተ ነህና", "הו, רחום, רחום ואוהב אדם, ה' אלוהינו, הסוחר את חטאי העולם, קבל את חרטתם של עבדיך וחטאיך. שפחות, והאר עליהן באור חיי עולם, וסלח להן, ה', על כל חטאיהם; כי טוב אתה ואוהב אדם."], ["ይቅር ባይ አምላካችን እግዚአብሔር ሆይ መዓትህ የራቀ ምሕረትህም የበዛ እውነተኛም የምትሆን የኔን ኃጢአቴን አስተስርይልኝ ወንዶችንና ሴቶችንም ባሮችህንም ሁሉ ከበደልም ከመርገምም ሁሉ አድናቸው።", "ה' אלוהינו רחום ארך אפיים רב חסדים וצדיק סלח לי חטאיי והציל את כל עבדיך ושפחותיך מכל צרה עבירה וקללה."], ["በቃላችንም ቢሆን በሥራችንም ቢሆን በአሳባችንም ቢሆን አቤቱ አንተን ብንበድል ተውልን አስተሥርይ አቃልልን ይቅርም በለን። አምላካችን አንተ ቸር ሰውን ወዳጅ ነህና እግዚአብሔር ሆይ እኛን አገልጋዮችህን ማረን። አቤቱ የተፈታን ነጻም የወጣን አድርገን ወገኖችህንም ሁሉ ፍታቸው ኃጥእ የምሆን እኔንም ባርያህን ፍታኝ ።", "אם חטאנו נגדך, יהוה, אם בדברנו או במעשנו או במחשבתנו, שחרר, מחל, סלח ורחם, כי טוב אתה ואוהב בני האדם, יהוה אלוהינו. הו יהוה, מחל לנו ושחרר אותנו, ומחל לכל עמך, ומחל לי עבדך החוטא."], ["ክቡር የሚሆን የጳጳሳቱን አለቃ አስበው ብጹዕ የሚሆን አባ ... አስበው አምላካችን ሆይ ለብዙ ዘመናት ለረጅም ወራት በእውነትና በሰላም መጠበቅን ጠብቅልን", "זכור, אדוני, את האב הנכבד, את הפטריארך שלנו אבא (......) ואת הארכיבישוף המבורך אבא (.....) אלוהינו, שמור אותם לנו לשנים רבות ואורך ימים בצדק ובשלום."], ["የጳጳሳቱን አለቆች ጳጳሳቱንና ኤጲስ ቆጶሳቱን ቀሳውስቱንና ዲያቆናቱን አንባቢዎችንና መዘምራኑን ደናግሉንና መነኮሳቱን ባልቴቶቹንና አባት እናት የሞቱባቸውን ወንዶቹንና ሴቶቹን ሸማግሌዎቹንና ልጆቹን ክብርት በምትሆን በዚህች ቤተ ክርስቲያን ያሉትን የቆሙትንም የክርስቲያንን ወገኖች ሁሉ ክርስቶስን በማመን አጽናቸው።", "זכור, אדוני, את האבות, ארכיבישופים, בישופים, כמרים ודיאקונים, אנגנוסטים וזמרים, בתולות ונזירים, אלמנות ויתומים, גברים ונשים, זקנים וילדים; וכל הנוצרים העומדים בכנסייה קדושה זו; חזקו אותם באמונת המשיח."], ["አቤቱ በቀናች ሃይማኖት ሁነው የሞቱትንና ያረፉትን አባቶቻችንንና ወድንሞቻችንን እኅቶቻችንንም ሁሉ አስባቸው ነፍሶቻቸውንም በአብርሃምና በይስሐቅ በያዕቆብም አጠገብ አኑር።", "זכור, ה', את כל אבותינו, אחים ואחיות הישנים ונחים באמונה האורתודוקסית, ומניחים את נשמותיהם בחיק אברהם, יצחק ויעקב."], ["እኛንም ከኃጢአት ሁሉ ከመርገምም ከበደልም ሁሉ ከክህደትም ሁሉ በሐሰትም ከመማል ሁሉ ከመገዘትም ሁሉ አድነን በክህደትና በርኩሰት ከዓላውያንና ከአረማውያን ጋር አንድ ከመሆን አድነን።", "וְאֲשֶׁר $('bFav').onclick=()=>{favs=favs.includes(cur)?favs.filter(x=>x!=cur):[...favs,cur];st.set('favs',favs);render()};
let tx=0,ty=0;const mn=$('main');
mn.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
mn.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(tx>=18&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2)go(cur+(dx<0?1:-1))},{passive:true});
function prev(n){const t=D[n-1].map(txt).join(' ');return t.length>90?t.slice(0,90)+'…':t}
function menu(){const L=$('list');L.innerHTML='<h3>ማውጫ · תוכן</h3>';
 TOC.forEach(t=>L.appendChild(item(t[0],t[1],'')));
 if(favs.length){L.insertAdjacentHTML('beforeend','<h3>★ ተወዳጅ · מועדפים</h3>');favs.slice().sort((a,b)=>a-b).forEach(n=>L.appendChild(item(n,'#'+n,prev(n))))}
 L.insertAdjacentHTML('beforeend','<h3>ሁሉም ገጾች · כל העמודים</h3>');for(let n=1;n<=N;n++)L.appendChild(item(n,'#'+n,prev(n)))}
function item(n,a,b,q){const d=document.createElement('div');d.className='it';d.innerHTML='<b></b><small></small>';d.firstChild.textContent=a;d.lastChild.textContent=b;if(!b)d.lastChild.remove();d.onclick=()=>{$('pane').classList.remove('show');go(n)};return d}
function search(q){const L=$('list');L.innerHTML='';q=q.trim();if(!q){menu();return}
 let c=0;for(let n=1;n<=N&&c<60;n++){const t=D[n-1].map(txt).join(' ');const i=t.indexOf(q);if(i<0)continue;c++;
  const d=item(n,'#'+n+' · '+secOf(n),'');const s=document.createElement('small');const a=Math.max(0,i-30);
  s.textContent=(a?'…':'')+t.slice(a,i+q.length+60);d.appendChild(s);L.appendChild(d)}
 if(!c)L.innerHTML='<p class="hint">ምንም አልተገኘም · לא נמצא</p>'}

let lh=st.get('lh',1.7);
const IC={contents:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',text:'<path d="M3 20 9 5l6 15M5.5 14h7M14 20l3.5-9 3.5 9M15.5 17h4"/>',email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',rate:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>'};
const ITEMS=[['contents','Contents'],['search','Search'],['share','Share app'],['settings','Settings'],['text','Text appearance'],['email','Email'],['rate','Rate this app'],['about','About']];
const EM='zelalemdessie@gmail.com';
const APPT='ኩሙ ለቲፊላ · קמו לתפילה';
function openDrawer(){$('drawer').classList.add('open');$('scrim').classList.add('show')}
function closeDrawer(){$('drawer').classList.remove('open');$('scrim').classList.remove('show')}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.display='none'},2200)}
function dlg(title,node){$('dtt').textContent=title;const b=$('dbody');b.innerHTML='';b.appendChild(node);$('dlg').classList.add('show')}
function closeDlg(){$('dlg').classList.remove('show')}
function mail(sub,body){location.href='mailto:'+EM+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body||'')}
function openPane(f){$('pane').classList.add('show');$('q').value='';menu();if(f)setTimeout(()=>{$('q').focus()},60)}
async function shareApp(){const u=location.href.split('#')[0];try{if(navigator.share){await navigator.share({title:APPT,text:APPT,url:u});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(u);toast('Link copied')}catch(e){prompt('Copy this link',u)}}
function mk(html){const d=document.createElement('div');d.innerHTML=html;return d}
function themeSw(box){const c=document.documentElement.dataset.theme||'dark';TH.forEach(t=>{const b=document.createElement('button');b.className='sw'+(t[0]==c?' sel':'');b.title=t[3];b.setAttribute('aria-label',t[3]);b.style.background='linear-gradient(135deg,'+t[1]+' 55%,'+t[2]+' 55%)';b.onclick=()=>{document.documentElement.dataset.theme=t[0];st.set('theme',t[0]);box.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};box.appendChild(b)})}
function textDlg(){const d=mk('<div class="lab2">Text size</div><div class="row"><button id="tm">A−</button><input type="range" id="tr" min="12" max="48" step="2" style="flex:3"><button id="tp2">A+</button></div><div class="lab2">Line spacing</div><div class="row" id="lhr"></div><div class="lab2">Background color</div><div class="row" id="thr"></div><p id="smp" dir="auto" style="margin:8px 0 0;line-height:1.7;text-align:left">ለጸሎት ተነሡ<br><span dir="rtl" style="color:var(--he);display:block;text-align:right">קמו לתפילה</span></p>');
const r=d.querySelector('#tr'),s=d.querySelector('#smp');r.value=fs;s.style.fontSize=fs+'px';
const setfs=v=>{fs=Math.max(12,Math.min(48,v));r.value=fs;s.style.fontSize=fs+'px';st.set('fs',fs);render()};
r.oninput=()=>setfs(+r.value);d.querySelector('#tm').onclick=()=>setfs(fs-2);d.querySelector('#tp2').onclick=()=>setfs(fs+2);
const lr=d.querySelector('#lhr');[['Compact',1.4],['Normal',1.7],['Wide',2.1]].forEach(a=>{const b=document.createElement('button');b.textContent=a[0];if(lh==a[1])b.className='on';b.onclick=()=>{lh=a[1];st.set('lh',lh);lr.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()};lr.appendChild(b)});
themeSw(d.querySelector('#thr'));dlg('Text appearance',d)}
function setDlg(){const d=mk('<div class="lab2">Show language</div><div class="row" id="lgr"></div><div class="lab2">Your data on this phone</div><div class="row"><button id="cf">Clear favorites</button><button id="rp">Back to first slide</button></div><div class="row"><button id="rs">Restore default settings</button></div>');
const lg=d.querySelector('#lgr');['Both','Amharic only','Hebrew only'].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(mode==i)b.className='on';b.onclick=()=>{mode=i;st.set('mode',mode);lg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()};lg.appendChild(b)});
d.querySelector('#cf').onclick=()=>{if(confirm('Clear all your favorites?')){favs=[];st.set('favs',favs);render();toast('Favorites cleared')}};
d.querySelector('#rp').onclick=()=>{go(1);closeDlg()};
d.querySelector('#rs').onclick=()=>{if(confirm('Restore default text size, spacing, language and color?')){fs=20;lh=1.7;mode=0;st.set('fs',fs);st.set('lh',lh);st.set('mode',mode);document.documentElement.dataset.theme='dark';st.set('theme','dark');render();closeDlg();toast('Settings restored')}};
dlg('Settings',d)}
function rateDlg(){const d=mk('<p style="margin:0 0 6px">How do you like this app?</p><div class="stars" id="stz"></div><p id="rth" style="color:var(--mut);margin:8px 0"></p><div class="row"><button id="rfb">Send feedback by email</button></div>');
const z=d.querySelector('#stz'),th=d.querySelector('#rth');let rt=st.get('rate',0);
const paint=()=>{z.innerHTML='';for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent=i<=rt?'★':'☆';b.setAttribute('aria-label',i+' stars');b.onclick=()=>{rt=i;st.set('rate',rt);th.textContent='Thank you for rating '+i+' of 5!';paint()};z.appendChild(b)}};paint();if(rt)th.textContent='Your rating: '+rt+' of 5';
d.querySelector('#rfb').onclick=()=>mail(APPT+' - feedback','Rating: '+(rt||'-')+' of 5\n\n');dlg('Rate this app',d)}
function aboutDlg(){dlg('About',mk('<p style="margin:0 0 8px;font-size:17px;font-weight:bold;color:var(--acc)">'+APPT+'</p><p style="margin:0 0 8px">ሥርዓተ ቅዳሴ · Prayer Book</p><p style="margin:0 0 8px;color:var(--mut)">Content: አኰቴተ ቁርባን የካልእ ጎርጎርዮስ<br>'+N+' slides · Amharic, Ge’ez and Hebrew<br>Version 1.0</p><p style="margin:0;color:var(--mut)">Works offline after the first visit when it is added to your home screen.</p>'))}
const ACT={contents:()=>openPane(false),search:()=>openPane(true),share:shareApp,settings:setDlg,text:textDlg,email:()=>mail(APPT+' - feedback',''),rate:rateDlg,about:aboutDlg};
(()=>{const L=$('dlist');ITEMS.forEach(i=>{const b=document.createElement('button');b.className='di';b.innerHTML='<svg viewBox="0 0 24 24">'+IC[i[0]]+'</svg><span>'+i[1]+'</span>';b.onclick=()=>{closeDrawer();ACT[i[0]]()};L.appendChild(b)});
const ic=document.querySelector('link[rel="apple-touch-icon"]');if(ic)$('dimg').src=ic.href;else $('dimg').style.display='none'})();
$('bMenu').onclick=openDrawer;$('scrim').onclick=closeDrawer;$('dx').onclick=closeDlg;$('dlg').onclick=e=>{if(e.target===$('dlg'))closeDlg()};
let sx=0,sy=0,edge=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;edge=sx<18},{passive:true});
document.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2)return;if(dx>0&&edge)openDrawer();else if(dx<0&&$('drawer').classList.contains('open'))closeDrawer()},{passive:true});

$('bClose').onclick=()=>$('pane').classList.remove('show');
$('q').oninput=e=>search(e.target.value);
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js')}catch(e){}})}
</script></body></html>
